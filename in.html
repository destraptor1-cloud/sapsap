<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Маркетплейс</title>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #1a1a1a);
            --hint: var(--tg-theme-hint-color, #999999);
            --link: var(--tg-theme-link-color, #2e8bff);
            --button: var(--tg-theme-button-color, #2e8bff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f5f5f5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--secondary-bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        .card {
            background: var(--bg);
            border-radius: 16px;
            padding: 20px;
            margin: 10px 0;
            width: 100%;
            max-width: 400px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .btn {
            background: var(--button);
            color: var(--button-text);
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px 0;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-block {
            width: 100%;
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid var(--hint);
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
        }

        .tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg);
            display: flex;
            border-top: 1px solid #ccc;
            z-index: 10;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 14px;
            color: var(--hint);
            cursor: pointer;
            transition: color 0.2s;
        }

        .tabs button.active {
            color: var(--link);
            font-weight: bold;
        }

        .product-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .product-card img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .page {
            display: none;
            padding: 20px;
            padding-bottom: 80px; /* для табов */
        }

        .page.active {
            display: block;
        }

        .badge {
            background: red;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 12px;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <!-- Экран для неверифицированных пользователей -->
    <div id="notVerifiedScreen" class="screen">
        <div class="card" style="text-align: center;">
            <h3 id="notVerifiedTitle">Вход</h3>
            <p id="notVerifiedMessage"></p>
            <div id="verifyBlock" style="display:none;">
                <input type="text" id="codeInput" placeholder="Код из сообщения" maxlength="4" inputmode="numeric" autocomplete="off">
                <button class="btn btn-block" id="sendCodeBtn">Подтвердить</button>
            </div>
            <button class="btn btn-block" id="goToBotBtn" style="display:none;">Открыть бота</button>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="mainScreen" class="screen">
        <div class="tabs">
            <button id="shopTab" data-page="shop" class="active">🛍 <span id="tab_shop_label">Товары</span></button>
            <button id="cartTab" data-page="cart">🛒 <span id="tab_cart_label">Корзина</span> <span id="cartBadge" class="badge" style="display:none;">0</span></button>
            <button id="profileTab" data-page="profile">👤 <span id="tab_profile_label">Профиль</span></button>
            <button id="ordersTab" data-page="orders">📋 <span id="tab_orders_label">Заказы</span></button>
        </div>
        <div id="page_shop" class="page active"></div>
        <div id="page_cart" class="page"></div>
        <div id="page_profile" class="page"></div>
        <div id="page_orders" class="page"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ================== ГЛОБАЛЬНЫЕ НАСТРОЙКИ ==================
        // Замени на свой URL API (должен быть HTTPS)
        const API_BASE_URL = 'https://reminder-mystify-blaming.ngrok-free.dev'; // ← поменяй!
        const BOT_USERNAME = 'rtdff_bot'; // ← поменяй!

        // Получение параметров из URL (передаются ботом)
        const urlParams = new URLSearchParams(location.search);
        const userId = urlParams.get('user_id');
        const lang = urlParams.get('lang') || 'ru';
        const verifyMode = urlParams.get('verify') === '1';

        // Проверка наличия Telegram SDK
        if (!window.Telegram) {
            document.body.innerHTML = '<div class="screen active"><h2>Откройте эту страницу через Telegram</h2></div>';
            throw new Error('Telegram SDK не загружен');
        }
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ================== ПЕРЕВОДЫ ==================
        const t = (key, ...args) => {
            const dict = {
                ru: {
                    notVerifiedTitle: 'Вход',
                    notVerifiedMsg: 'Войдите через Telegram-бота, чтобы продолжить.',
                    goToBot: 'Открыть бота',
                    enterCode: 'Введите код из сообщения',
                    codePlaceholder: 'Код',
                    confirm: 'Подтвердить',
                    tab_shop: 'Товары',
                    tab_cart: 'Корзина',
                    tab_profile: 'Профиль',
                    tab_orders: 'Заказы',
                    addToCart: 'В корзину',
                    checkout: 'Оформить заказ',
                    emptyCart: 'Корзина пуста',
                    total: 'Итого',
                    sum: 'сум',
                    save: 'Сохранить',
                    ordersEmpty: 'У вас пока нет заказов',
                    firstName: 'Имя',
                    address: 'Адрес доставки',
                    phone: 'Телефон',
                    profileUpdated: 'Профиль обновлён',
                    orderSent: 'Заказ отправлен',
                    errorLoadProducts: 'Ошибка загрузки товаров',
                    errorLoadOrders: 'Ошибка загрузки заказов',
                },
                uz: {
                    notVerifiedTitle: 'Kirish',
                    notVerifiedMsg: 'Davom etish uchun Telegram-bot orqali kiring.',
                    goToBot: 'Botni ochish',
                    enterCode: 'Botdan kelgan kodni kiriting',
                    codePlaceholder: 'Kod',
                    confirm: 'Tasdiqlash',
                    tab_shop: 'Mahsulotlar',
                    tab_cart: 'Savat',
                    tab_profile: 'Profil',
                    tab_orders: 'Buyurtmalar',
                    addToCart: 'Savatga',
                    checkout: 'Rasmiylashtirish',
                    emptyCart: 'Savat bo\'sh',
                    total: 'Jami',
                    sum: 'so\'m',
                    save: 'Saqlash',
                    ordersEmpty: 'Sizda hali buyurtmalar yo\'q',
                    firstName: 'Ism',
                    address: 'Yetkazib berish manzili',
                    phone: 'Telefon',
                    profileUpdated: 'Profil yangilandi',
                    orderSent: 'Buyurtma yuborildi',
                    errorLoadProducts: 'Mahsulotlarni yuklashda xatolik',
                    errorLoadOrders: 'Buyurtmalarni yuklashda xatolik',
                }
            };
            const currentDict = dict[lang] || dict.ru;
            let text = currentDict[key] || key;
            args.forEach((a, i) => { text = text.replace(`{${i}}`, a); });
            return text;
        };

        // ================== ОСНОВНЫЕ ЭЛЕМЕНТЫ ==================
        const notVerifiedScreen = document.getElementById('notVerifiedScreen');
        const mainScreen = document.getElementById('mainScreen');
        const verifyBlock = document.getElementById('verifyBlock');
        const goToBotBtn = document.getElementById('goToBotBtn');
        const notVerifiedMessage = document.getElementById('notVerifiedMessage');
        const notVerifiedTitle = document.getElementById('notVerifiedTitle');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const codeInput = document.getElementById('codeInput');

        // ================== ПРОВЕРКА СТАТУСА ПОЛЬЗОВАТЕЛЯ ==================
        async function checkUser() {
            try {
                const resp = await fetch(`${API_BASE_URL}/api/user`, {
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                if (!resp.ok) throw new Error('Ошибка сервера');
                const data = await resp.json();
                if (data && !data.error) {
                    // Пользователь верифицирован — показываем главный экран
                    showMainApp(data);
                } else {
                    showNotVerified(data?.error === 'verification_required' || verifyMode);
                }
            } catch (err) {
                console.error('Ошибка проверки пользователя:', err);
                showNotVerified(false);
            }
        }

        // ================== ОТОБРАЖЕНИЕ ЭКРАНОВ ==================
        function showNotVerified(isVerificationStep) {
            notVerifiedScreen.classList.add('active');
            mainScreen.classList.remove('active');

            notVerifiedTitle.textContent = t('notVerifiedTitle');
            if (isVerificationStep) {
                // Режим подтверждения кода
                verifyBlock.style.display = 'block';
                goToBotBtn.style.display = 'none';
                notVerifiedMessage.textContent = t('enterCode');
                codeInput.placeholder = t('codePlaceholder');
            } else {
                // Обычный вход (не верифицирован)
                verifyBlock.style.display = 'none';
                goToBotBtn.style.display = 'block';
                notVerifiedMessage.textContent = t('notVerifiedMsg');
                goToBotBtn.textContent = t('goToBot');
            }
        }

        function showMainApp(user) {
            notVerifiedScreen.classList.remove('active');
            mainScreen.classList.add('active');
            initApp(user);
        }

        // ================== ОБРАБОТЧИКИ КНОПОК (вход) ==================
        goToBotBtn.addEventListener('click', () => {
            window.open(`https://t.me/${BOT_USERNAME}`, '_blank');
        });

        sendCodeBtn.addEventListener('click', () => {
            const code = codeInput.value.trim();
            if (code.length !== 4) {
                tg.showAlert(t('enterCode'));
                return;
            }
            // Отправляем код в бота
            tg.sendData(JSON.stringify({ action: 'verify', code }));
            tg.showAlert('Код отправлен. Проверьте сообщения бота.');
            // Не закрываем, чтобы пользователь мог увидеть алерт и закрыть самостоятельно
        });

        // ================== ИНИЦИАЛИЗАЦИЯ ГЛАВНОГО ПРИЛОЖЕНИЯ ==================
        function initApp(user) {
            // Локализация вкладок
            document.getElementById('tab_shop_label').textContent = t('tab_shop');
            document.getElementById('tab_cart_label').textContent = t('tab_cart');
            document.getElementById('tab_profile_label').textContent = t('tab_profile');
            document.getElementById('tab_orders_label').textContent = t('tab_orders');

            // Хранилище корзины
            let cart = [];

            // Переключение страниц
            const pages = {
                shop: document.getElementById('page_shop'),
                cart: document.getElementById('page_cart'),
                profile: document.getElementById('page_profile'),
                orders: document.getElementById('page_orders')
            };
            const tabs = {
                shop: document.getElementById('shopTab'),
                cart: document.getElementById('cartTab'),
                profile: document.getElementById('profileTab'),
                orders: document.getElementById('ordersTab')
            };

            function switchPage(pageName) {
                Object.keys(pages).forEach(k => {
                    pages[k].classList.remove('active');
                    tabs[k].classList.remove('active');
                });
                pages[pageName].classList.add('active');
                tabs[pageName].classList.add('active');

                if (pageName === 'cart') renderCart();
                if (pageName === 'profile') renderProfile(user);
                if (pageName === 'orders') loadOrders();
            }

            // Навешиваем обработчики на табы
            Object.keys(tabs).forEach(key => {
                tabs[key].addEventListener('click', () => switchPage(key));
            });

            // Загрузка товаров
            async function loadProducts() {
                try {
                    const resp = await fetch(`${API_BASE_URL}/api/products?lang=${lang}`);
                    if (!resp.ok) throw new Error();
                    const products = await resp.json();
                    renderProducts(products);
                } catch (e) {
                    pages.shop.innerHTML = `<p style="padding:20px;">${t('errorLoadProducts')}</p>`;
                }
            }

            function renderProducts(products) {
                if (!products.length) {
                    pages.shop.innerHTML = '<p style="padding:20px;">Нет доступных товаров</p>';
                    return;
                }
                let html = '';
                products.forEach(p => {
                    html += `
                        <div class="card product-card">
                            <img src="${p.image_url || 'https://placehold.co/64x64?text=No+Image'}" alt="" onerror="this.src='https://placehold.co/64x64?text=No+Image'">
                            <div class="product-info">
                                <b>${p.name}</b><br>
                                <small>${p.price.toLocaleString()} ${t('sum')}</small>
                            </div>
                            <button class="btn add-to-cart-btn" data-id="${p.id}" data-name="${p.name}" data-price="${p.price}">${t('addToCart')}</button>
                        </div>
                    `;
                });
                pages.shop.innerHTML = html;

                // Навешиваем события на кнопки "В корзину"
                document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = parseInt(btn.dataset.id);
                        const name = btn.dataset.name;
                        const price = parseInt(btn.dataset.price);
                        const existing = cart.find(item => item.product_id === id);
                        if (existing) {
                            existing.qty += 1;
                        } else {
                            cart.push({ product_id: id, name, price, qty: 1 });
                        }
                        updateCartBadge();
                    });
                });
            }

            // Корзина
            function renderCart() {
                if (cart.length === 0) {
                    pages.cart.innerHTML = `<p style="padding:20px;">${t('emptyCart')}</p>`;
                    return;
                }
                let total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
                let html = cart.map(item => `
                    <div class="cart-item">
                        <span>${item.name} x${item.qty}</span>
                        <span>${(item.price * item.qty).toLocaleString()} ${t('sum')}</span>
                        <button class="btn remove-item-btn" data-id="${item.product_id}" style="background:transparent; color:red;">×</button>
                    </div>
                `).join('');
                html += `
                    <div style="text-align:right; font-weight:bold; margin-top:12px;">
                        ${t('total')}: ${total.toLocaleString()} ${t('sum')}
                    </div>
                    <button class="btn btn-block" id="checkoutBtn">${t('checkout')}</button>
                `;
                pages.cart.innerHTML = html;

                // Удаление из корзины
                document.querySelectorAll('.remove-item-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = parseInt(btn.dataset.id);
                        cart = cart.filter(item => item.product_id !== id);
                        renderCart();
                        updateCartBadge();
                    });
                });

                // Оформление заказа
                const checkoutBtn = document.getElementById('checkoutBtn');
                if (checkoutBtn) {
                    checkoutBtn.addEventListener('click', () => {
                        const order = {
                            action: 'order',
                            items: cart.map(item => ({
                                product_id: item.product_id,
                                qty: item.qty,
                                price: item.price
                            })),
                            total: total
                        };
                        tg.sendData(JSON.stringify(order));
                        tg.showAlert(t('orderSent'));
                        cart = [];
                        updateCartBadge();
                        renderCart();
                    });
                }
            }

            function updateCartBadge() {
                const count = cart.reduce((s, item) => s + item.qty, 0);
                const badge = document.getElementById('cartBadge');
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'inline';
                } else {
                    badge.style.display = 'none';
                }
            }

            // Профиль
            function renderProfile(user) {
                const html = `
                    <div class="card">
                        <input type="text" id="firstNameInput" placeholder="${t('firstName')}" value="${user.first_name || ''}">
                        <input type="text" id="addressInput" placeholder="${t('address')}" value="${user.address || ''}">
                        <p style="margin:12px 0;">${t('phone')}: ${user.phone || '—'}</p>
                        <button class="btn btn-block" id="saveProfileBtn">${t('save')}</button>
                    </div>
                `;
                pages.profile.innerHTML = html;

                document.getElementById('saveProfileBtn').addEventListener('click', () => {
                    const firstName = document.getElementById('firstNameInput').value;
                    const address = document.getElementById('addressInput').value;
                    tg.sendData(JSON.stringify({
                        action: 'update_profile',
                        first_name: firstName,
                        address: address
                    }));
                    tg.showAlert(t('profileUpdated'));
                });
            }

            // Заказы
            async function loadOrders() {
                try {
                    const resp = await fetch(${API_BASE_URL}/api/orders, {
                        headers: { 'X-Telegram-Init-Data': tg.initData }
                    });
                    if (!resp.ok) throw new Error();
                    const orders = await resp.json();
                    if (!orders.length) {
                        pages.orders.innerHTML = <p style="padding:20px;">${t('ordersEmpty')}</p>;
                        return;
                    }
                    let html = '';
                    orders.forEach(o => {
                        html += 
                            <div class="card">
                                <b>№${o.id}</b> — ${o.status}<br>
                                <small>${o.total.toLocaleString()} ${t('sum')}</small>
                            </div>
                        ;
                    });
                    pages.orders.innerHTML = html;
                } catch (e) {
                    pages.orders.innerHTML = <p style="padding:20px;">${t('errorLoadOrders')}</p>`;
                }
            }

            // Стартовая загрузка
            loadProducts();
            updateCartBadge();
            // Первоначально показываем страницу товаров
            switchPage('shop');
        }

        // ================== СТАРТ ==================
        // Если в URL есть параметр verify=1, сразу показываем экран ввода кода
        if (verifyMode) {
            showNotVerified(true);
        } else {
            checkUser();
        }
    </script>
</body>
</html>

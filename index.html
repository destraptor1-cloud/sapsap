<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Marketplace</title>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #fff);
            --text: var(--tg-theme-text-color, #222);
            --hint: var(--tg-theme-hint-color, #999);
            --link: var(--tg-theme-link-color, #007aff);
            --button: var(--tg-theme-button-color, #007aff);
            --button-text: var(--tg-theme-button-text-color, #fff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--secondary-bg);
            color: var(--text);
            padding-bottom: 60px;
        }
        .screen { display: none; padding: 16px; }
        .screen.active { display: block; }
        .tabs {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg); display: flex; border-top: 1px solid #ccc; z-index: 10;
        }
        .tabs button {
            flex: 1; padding: 12px; background: none; border: none;
            font-size: 14px; color: var(--hint); cursor: pointer;
        }
        .tabs button.active { color: var(--link); font-weight: bold; }
        .card {
            background: var(--bg); border-radius: 16px; padding: 12px; margin-bottom: 10px;
            display: flex; gap: 12px; align-items: center;
        }
        .card img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
        .btn {
            background: var(--button); color: var(--button-text); border: none;
            padding: 10px 16px; border-radius: 12px; font-weight: 600; cursor: pointer;
        }
        .cart-items { margin-top: 10px; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; }
    </style>
</head>
<body>
    <!-- Экран для неверифицированных пользователей -->
    <div id="notVerifiedScreen" class="screen">
        <p id="notVerifiedText"></p>
        <button class="btn" id="goToBotBtn"></button>
    </div>

    <!-- Основной интерфейс -->
    <div id="mainScreen" class="screen">
        <div class="tabs">
            <button id="shopTab" class="active" data-page="shop">🛍 <span id="tab_shop">Товары</span></button>
            <button id="cartTab" data-page="cart">🛒 <span id="tab_cart">Корзина</span></button>
            <button id="profileTab" data-page="profile">👤 <span id="tab_profile">Профиль</span></button>
            <button id="ordersTab" data-page="orders">📋 <span id="tab_orders">Заказы</span></button>
        </div>
        <div id="page_shop" class="page"></div>
        <div id="page_cart" class="page" style="display:none"></div>
        <div id="page_profile" class="page" style="display:none"></div>
        <div id="page_orders" class="page" style="display:none"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем параметры из URL
        const urlParams = new URLSearchParams(location.search);
        const userId = urlParams.get('user_id');
        const lang = urlParams.get('lang') || 'ru';
        const verifyMode = urlParams.get('verify') === '1';

        // Локализация
        const t = (key, ...args) => {
            const dict = window.translations[lang] || window.translations['ru'];
            let text = dict[key] || key;
            args.forEach((val, idx) => { text = text.replace('{${idx}}', val); });
            return text;
        };
        // Загружаем переводы
        window.translations = {
            ru: {
                not_verified: "Войдите через Telegram-бота, чтобы продолжить.",
                go_to_bot: "Открыть бота",
                tab_shop: "Товары", tab_cart: "Корзина", tab_profile: "Профиль", tab_orders: "Заказы",
                add_to_cart: "В корзину", checkout: "Оформить заказ", empty_cart: "Корзина пуста",
                total: "Итого", sum: "сум", save: "Сохранить", orders_empty: "У вас пока нет заказов",
                first_name: "Имя", address: "Адрес доставки", phone_label: "Телефон",
                profile_updated: "Профиль обновлён", order_sent: "Заказ отправлен"
            },
            uz: {
                not_verified: "Davom etish uchun Telegram-bot orqali kiring.",
                go_to_bot: "Botni ochish",
                tab_shop: "Mahsulotlar", tab_cart: "Savat", tab_profile: "Profil", tab_orders: "Buyurtmalar",
                add_to_cart: "Savatga", checkout: "Rasmiylashtirish", empty_cart: "Savat bo'sh",
                total: "Jami", sum: "so'm", save: "Saqlash", orders_empty: "Sizda hali buyurtmalar yo'q",
                first_name: "Ism", address: "Yetkazib berish manzili", phone_label: "Telefon",
                profile_updated: "Profil yangilandi", order_sent: "Buyurtma yuborildi"
            }
        };

        // Проверяем, нужно ли подтверждение кода
        if (verifyMode) {
            document.getElementById('notVerifiedScreen').classList.add('active');
            document.getElementById('notVerifiedText').textContent = "Iltimos, kodni kiriting" ;
            // показываем поле ввода кода
            // (для краткости опускаю, но лучше показать input и отправить через sendData)
        }

        // Основная логика, если пользователь уже верифицирован
        if (!verifyMode) {
            // Проверим верификацию через API
            fetch(/api/user, { headers: { 'X-Telegram-Init-Data': tg.initData } })
                .then(r => r.json())
                .then(user => {
                    if (user.error) {
                        // показать экран "не верифицирован"
                        showNotVerified();
                    } else {
                        initMainApp(user);
                    }
                })
                .catch(() => showNotVerified());
        }

        function showNotVerified() {
            document.getElementById('notVerifiedScreen').classList.add('active');
            document.getElementById('notVerifiedText').textContent = t('not_verified');
            document.getElementById('goToBotBtn').textContent = t('go_to_bot');
            document.getElementById('goToBotBtn').onclick = () => {
                // ссылка на основного бота
                window.open("https://t.me/your_main_bot", "_blank");
            };
        }

        function initMainApp(user) {
            document.getElementById('mainScreen').classList.add('active');
            // обновим названия вкладок
            document.querySelectorAll('[id^="tab_"]').forEach(el => {
                const key = el.id; // tab_shop -> tab_shop
                el.textContent = t(key);
            });

            let cart = [];

            // Загрузка товаров
            fetch('/api/products?lang=${lang}')
                .then(r => r.json())
                .then(products => renderShop(products));

            function renderShop(products) {
                const container = document.getElementById('page_shop');
                container.innerHTML = '';
                products.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <img src="${p.image_url}" alt="">
                        <div style="flex:1;">
                            <b>${p.name}</b><br>
                            <small>${p.price} ${t('sum')}</small>
                        </div>
                        <button class="btn add-to-cart" data-id="${p.id}" data-name="${p.name}" data-price="${p.price}">${t('add_to_cart')}</button>
                    `;
                    container.appendChild(div);
                });
                document.querySelectorAll('.add-to-cart').forEach(btn => {
                    btn.onclick = () => {
                        const id = parseInt(btn.dataset.id);
                        const name = btn.dataset.name;
                        const price = parseInt(btn.dataset.price);
                        const existing = cart.find(i => i.product_id === id);
                        if (existing) existing.qty++;
                        else cart.push({ product_id: id, name, price, qty: 1 });
                        updateCartBadge();
                    };
                });
            }

            // Навигация
            const pages = {
                shop: document.getElementById('page_shop'),
                cart: document.getElementById('page_cart'),
                profile: document.getElementById('page_profile'),
                orders: document.getElementById('page_orders')
            };
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.onclick = () => {
                    const page = btn.dataset.page;
                    for (const p in pages) pages[p].style.display = 'none';
                    pages[page].style.display = 'block';
                    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (page === 'cart') renderCart();
                    if (page === 'profile') renderProfile(user);
                    if (page === 'orders') loadOrders();
                };
            });

            function renderCart() {
                const container = document.getElementById('page_cart');
                if (cart.length === 0) {
                    container.innerHTML = <p>${t('empty_cart')}</p>;
                    return;
                }
                let total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
                container.innerHTML = `
                    <div class="cart-items">
                        ${cart.map(item => `
                            <div class="cart-item">
                                <span>${item.name} x${item.qty}</span>
                                <span>${item.price * item.qty} ${t('sum')}</span>
                            </div>
                        `).join('')}
                    </div>
                    <p><b>${t('total')}: ${total} ${t('sum')}</b></p>
                    <button class="btn" id="checkoutBtn">${t('checkout')}</button>
                `;
                document.getElementById('checkoutBtn').onclick = () => {
                    const order = {
                        action: 'order',
                        items: cart.map(i => ({ product_id: i.product_id, qty: i.qty, price: i.price })),
                        total
                    };
                    tg.sendData(JSON.stringify(order));
                    cart = [];
                    updateCartBadge();
                    renderCart();
                };
            }

            function renderProfile(user) {
                const container = document.getElementById('page_profile');
                container.innerHTML = `
                    <input id="firstName" placeholder="${t('first_name')}" value="${user.first_name || ''}">
                    <input id="address" placeholder="${t('address')}" value="${user.address || ''}">
                    <p>${t('phone_label')}: ${user.phone}</p>
                    <button class="btn" id="saveProfileBtn">${t('save')}</button>
                `;
                document.getElementById('saveProfileBtn').onclick = () => {
                    const firstName = document.getElementById('firstName').value;
                    const address = document.getElementById('address').value;
                    tg.sendData(JSON.stringify({ action: 'update_profile', first_name: firstName, address }));
                    tg.showAlert(t('profile_updated'));
                };
            }

            async function loadOrders() {
                const container = document.getElementById('page_orders');
                const resp = await fetch(/api/orders, { headers: { 'X-Telegram-Init-Data': tg.initData } });
                const orders = await resp.json();
                if (orders.length === 0) {
                    container.innerHTML = <p>${t('orders_empty')}</p>;
                    return;
                }
                container.innerHTML = orders.map(o => `
                    <div class="card">
                        <b>№${o.id}</b> – ${o.status} | ${o.total} ${t('sum')}
                    </div>
                `).join('');
            }

            function updateCartBadge() {
                const count = cart.reduce((s, i) => s + i.qty, 0);
                const badge = document.getElementById('tab_cart');
                badge.textContent = `${t('tab_cart')} (${count})`;
            }
            pages.shop.style.display = 'block';
            updateCartBadge();
        }
    </script>
</body>
</html>
